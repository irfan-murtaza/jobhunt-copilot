name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobhunt" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://jobhunt:jobhunt@localhost:5432/jobhunt_test
      REDIS_URL: redis://localhost:6379/9
      ANTHROPIC_API_KEY: test-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, cache-dependency-glob: "api/uv.lock" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Migrations apply cleanly from scratch
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest -q --cov=jobhunt --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: api-coverage, path: api/coverage.xml }

  web:
    name: Web lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: api, push: false, cache-from: type=gha, cache-to: type=gha,mode=max }
      - uses: docker/build-push-action@v6
        with: { context: web, push: false, cache-from: type=gha, cache-to: type=gha,mode=max }

  # Live evals cost money and need API keys, so they only run on demand.
  live-evals:
    name: Live evals (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "configured in the evals milestone"
