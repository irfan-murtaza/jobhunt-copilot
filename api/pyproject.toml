[project]
name = "jobhunt"
version = "0.1.0"
description = "JobHunt Copilot API: remote job ingestion, fit scoring, grounded resume tailoring and application tracking."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Irfan Murtaza", email = "dev.muhammad.irfan@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "structlog>=24.1",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "tenacity>=8.5",
  "anthropic>=0.40",
  "openai>=1.40",
  "langfuse>=2.50",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "asgi-lifespan>=2.1",
  "types-passlib",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "T20"]
ignore = ["S101", "RUF012", "B008", "S106"]  # asserts in tests; mutable class attrs on SQLAlchemy; Depends() defaults; literal token_type args

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test passwords
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:jobhunt.*"]
markers = ["db: requires a running PostgreSQL with pgvector", "live: calls real LLM APIs"]
